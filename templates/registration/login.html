{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body class="bg-dark text-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card bg-secondary text-white p-4 shadow border-0">
                    <h2 class="text-center mb-4 text-primary">Авторизация</h2>

                    {% if form.errors %}
                        <div class="alert alert-danger p-2 fs-6">Неверный email или пароль.</div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_username" class="form-label">Email</label>
                            <input type="email" name="username" autofocus autocomplete="email" required id="id_username" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="id_password" class="form-label">Пароль</label>
                            <input type="password" name="password" autocomplete="current-password" required id="id_password" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-2">Войти в сервис</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
